services:
  - type: web
    name: farm-observation-mvp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set this manually in the Render dashboard, never commit it
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.3
    disk:
      name: farm-data
      mountPath: /var/data
      sizeGB: 1   # evidence images add up - raise this once you're past MVP testing
